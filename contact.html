<script>
  // Add flip effect when page loads
  window.addEventListener("DOMContentLoaded", () => {
    document.body.classList.add("page-flip");
  });

  // Smooth transition when navigating between pages
  const links = document.querySelectorAll('a[href$=".html"]');
  links.forEach(link => {
    link.addEventListener("click", e => {
      e.preventDefault();
      document.body.classList.remove("page-flip");
      document.body.style.transform = "rotateY(90deg)";
      document.body.style.opacity = "0";
      setTimeout(() => {
        window.location.href = link.href;
      }, 500); // matches half the transition time
    });
  });
</script>
